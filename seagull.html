<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Seagull">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="theme-color" content="#262626">
  <title>Seagull</title>
  <link rel="icon" type="image/svg+xml" href="./seagull/icons/ai.storyteller.vectorcraft.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./seagull/icons/32/ai.storyteller.vectorcraft.png">
  <link rel="apple-touch-icon" href="./seagull/icons/256/ai.storyteller.vectorcraft.png">
<script type="module">
import init, * as bindings from './seagull/v.js';
const wasm=await init({module_or_path:'./seagull/v.wasm'});
window.wasmBindings=bindings;
dispatchEvent(new CustomEvent('TrunkApplicationStarted',{detail:{wasm}}));
</script>
<style>
html,body{
  margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#262626;
  overscroll-behavior:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
}
#vectorcraft_canvas{
  position:absolute;
  top:env(safe-area-inset-top,0);right:env(safe-area-inset-right,0);
  bottom:env(safe-area-inset-bottom,0);left:env(safe-area-inset-left,0);
  width:calc(100% - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
  height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:block;touch-action:none;
}
#vectorcraft_loading{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#b8b8b8;font:14px system-ui, sans-serif;pointer-events:none;
}
</style>
<link
  rel="modulepreload"
  href="./seagull/snippets/eframe/inline0.js"
  crossorigin="anonymous">
  <link
    rel="modulepreload"
    href="./seagull/v.js"
    crossorigin="anonymous">
<link
  rel="preload"
  href="./seagull/v.wasm"
  crossorigin="anonymous"
  as="fetch"
  type="application/wasm">
</head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading">Loading Seagull...</div>
</body>
</html>
