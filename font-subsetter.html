.preview{
  padding:.5em 1em;
  border:1px solid rgb(from currentColor r g b / .25);
  background:rgb(from currentColor r g b / .05);
  border-radius:1rem;
  min-height:15rem;
  width:100%;
  overflow:auto;
  font-size:calc(var(--size,100)/100*1em);
  outline:none;
  scrollbar-gutter:stable;
  display:grid;
  place-items:center;
  text-align:center;
  caret-shape:block;
  caret-color:#adf;
  text-wrap:pretty;
}
.sliders{
  display:grid;
  grid-template-columns:auto 1fr;
  grid-auto-rows:auto;
  list-style:none;
  width:100%;
  max-width:50ch;
  gap:1em 2em;
}
.sliders li{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:subgrid;
}
.sliders label{display:contents}
.features{
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-auto-rows:auto;
  list-style:none;
  gap:.25em 1em;
}
.features li{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:subgrid;
  padding:.25em;
}
.features label{display:contents}

.tables{
  justify-self:stretch;
  display:grid;
  grid-template-columns:1fr;
  gap:1em;
}
.table{
  font-size:1.5em;
  display:grid;
  grid-auto-flow:row;
  grid-template-columns:repeat(auto-fill,3em);
  gap:.1em;
}
.table>h3{
  grid-column:1 / -1;
  text-align:center;
}
.codepoint{
  position:relative;
  width:3em;height:3em;
  display:grid;place-items:center;
  background:rgb(from currentColor r g b / .05);
  user-select:none;
}
.codepoint:before{
  content:attr(data-codepoint);
  position:absolute;
  inset:.15em;
  display:grid;
  place-items:start center;
  font-size:.35em;
  font-family:monospace;
  opacity:.1;
}
.codepoint:after{
  content:attr(title);
  position:absolute;
  inset:.5em;
  display:grid;
  place-items:end center;
  font:300 .25em/1 monospace;
  letter-spacing:-.05em;
  text-align:center;
  opacity:.35;
}
.codepoint:not(.disabled):hover{
  user-select:auto;
  background:#282828;
}
.codepoint.disabled>span{opacity:.1}

<body>
<h1>Font Subsetter</h1>
<main>
  <div>Paste, drag &amp; drop,<br>or <input tabindex="0" type="file" id="file" title=" "><label for="file">select a font file</label> (ttf, otf or woff2).</div>
</main>
</body>
<script type="module">
let mod=import('./font-subsetter/lib.mjs');
const container=document.querySelector('main');
let controller;
let fontFace;
const open=async(blob)=>{
  if(!blob) return;
  controller?.abort();
  controller=new AbortController();
  const signal=controller.signal;
  const timeout=setTimeout(()=>document.body.setAttribute('inert',''),100);
  try{
    let data=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      signal.onabort=e=>{
        reader.abort();
        reject(e);
      };
      reader.onload=e=>resolve(new Uint8Array(e.target.result));
      reader.onerror=e=>reject(e?.target?.error||e);
      reader.readAsArrayBuffer(blob);
    });
    const {metadata,subset: _subset}=await mod;
    const info=await metadata(data,signal);
    data=info.input;
    delete info.input;
    console.log(JSON.stringify(info,null,2));
    const wdth=info.axes.find(axis=>axis.tag==='wdth');
    const wght=info.axes.find(axis=>axis.tag==='wght');
    const slnt=info.axes.find(axis=>axis.tag==='slnt');
    const descriptors={};
    if(wdth) descriptors.stretch=`${wdth.min}% ${wdth.max}%`;
    descriptors.weight=wght?`${wght.min} ${wght.max}`:'normal';
    descriptors.style=slnt?`oblique ${-slnt.max}deg ${-slnt.min}deg`:'normal';
    if(signal.aborted) return;
    const previousFontFace=fontFace;
    const newFontFace=new FontFace(`__${info.family_name}`,data,descriptors);
    let fontLoaded=false;
    try{
      await newFontFace.load();
      fontLoaded=true;
    }catch(e){
      console.error(e);
    }
    if(signal.aborted|| !fontLoaded) return;
    container.textContent='';
    container.style.setProperty('--font-family',`__${info.family_name}`);
    if(previousFontFace) await document.fonts.delete(previousFontFace);
    fontFace=newFontFace;
    await document.fonts.add(fontFace);
    const previewTitle=document.createElement('h2');
    previewTitle.textContent='Preview:';
    container.appendChild(previewTitle);
    const preview=document.createElement('div');
    preview.contentEditable='plaintext-only';
    preview.classList.add('preview');
    preview.textContent=`The quick brown fox jumps over the lazy dog.\nA very bad quack might jinx zippy fowls; beware!`;
    container.appendChild(preview);
    const axesTitle=document.createElement('h2');
    axesTitle.textContent='Axes:';
    container.appendChild(axesTitle);
    const sliders=document.createElement('ul');
    sliders.classList.add('sliders');
    for (const {tag,min,max,default:value} of [{tag:'size',min:'50','max':'200'},...info.axes??[]]){
      const li=document.createElement('li');
      li.classList.add('axis-slider');
      const label=document.createElement('label');
      label.textContent=tag;
      const input=document.createElement('input');
      input.type='range';
      input.max=max;
      input.min=min;
      input.value=value;
      input.addEventListener('change',_=>{
        container.style.setProperty(`--${tag}`,input.value);
      });
      label.appendChild(input);
      li.appendChild(label);
      sliders.appendChild(li);
    }
    container.appendChild(sliders);
    const featuresTitle=document.createElement('h2');
    featuresTitle.textContent='Features:';
    container.appendChild(featuresTitle);
    if(info.features?.length){
      const features=document.createElement('ul');
      features.classList.add('features');
      for(const {tag,name} of info.features){
        const li=document.createElement('li');
        const label=document.createElement('label');
        label.textContent=name;
        const code=document.createElement('code');
        code.textContent=tag;
        label.prepend(code);
        const checkbox=document.createElement('input');
        checkbox.type='checkbox';
        checkbox.id=`feature-${tag}`;
        switch(tag){
          case 'ccmp': case 'locl': case 'rlig': case 'liga': case 'clig': case 'calt': case 'kern': case 'mark': case 'mkmk': checkbox.checked=true;
        }
        checkbox.addEventListener('change',_=>{
          container.style.setProperty(`--${tag}`,checkbox.checked?'1':'0');
        });
        label.appendChild(checkbox);
        li.appendChild(label);
        features.appendChild(li);
      }
      container.appendChild(features);
    }
    const tablesTitle=document.createElement('h2');
    tablesTitle.textContent='Characters:';
    container.appendChild(tablesTitle);
    const tables=document.createElement('div');
    tables.classList.add('tables');
    for(const {name,start,end,codepoints,codepoint_names} of info.tables){
      const section=document.createElement('section');
      section.classList.add('table');
      const h3=document.createElement('h3');
      h3.textContent=name;
      section.appendChild(h3);
      const points=new Set(codepoints);
      const names=new Map(codepoint_names.map(({n,name})=>[n,name]));
      for(let cp=start;cp<end;++cp){
        const div=document.createElement('div');
        div.classList.add('codepoint');
        div.setAttribute('data-codepoint',`0x${cp.toString(16).padStart(4,'0')}`);
        if(!points.has(cp)) div.classList.add('disabled');
        const name=names.get(cp);
        if(name) div.title=name;
        const span=document.createElement('span');
        span.textContent=String.fromCodePoint(cp);
        div.appendChild(span);
        section.appendChild(div);
      }
      tables.appendChild(section);
    }
    container.appendChild(tables);
    clearTimeout(timeout);
  }finally{
    document.body.removeAttribute('inert');
  }
};
['dragenter','dragover','dragleave','drop'].forEach(type=>document.body.addEventListener(type,e=>{
  e.preventDefault();e.stopPropagation();
  document.body.classList.remove('dragover');
}));
document.body.addEventListener('dragover',e=>{
  e.dataTransfer.dropEffect='copy';document.body.classList.add('dragover');
});
document.body.addEventListener('drop',async e=>{
  const file=[...e.dataTransfer.files]?.[0];
  await open(file);
});
document.body.addEventListener('paste',async e=>{
  e.preventDefault();
  const blob=[...e.clipboardData.files]?.[0];
  await open(blob);
});
const uploader=document.querySelector('#file');
uploader.addEventListener('change',async e=>{
  e.preventDefault();
  const file=[...uploader.files]?.[0];
  console.log(file);
  await open(file);
});
</script>
